<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ULTRA ENGINE Pro</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
html, body { overflow-x: hidden; }
.dark { color-scheme: dark; }
.glass { @apply bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-xl; }
input, select, textarea { @apply bg-slate-100 dark:bg-slate-800 p-3 rounded-xl text-sm outline-none focus:ring-1 ring-blue-500 font-bold; }
.step-btn { @apply bg-slate-200 dark:bg-slate-700 w-9 h-9 flex items-center justify-center rounded-lg font-black active:scale-90 transition-all text-sm; }
::-webkit-scrollbar { display: none; }
</style>
</head>

<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 p-3 pb-24">

<div class="max-w-md mx-auto space-y-3">

<header class="flex justify-between items-center py-1">
    <h1 class="text-xl font-black italic text-blue-600 uppercase tracking-tighter">Ultra Engine</h1>
    <button onclick="toggleDarkMode()" class="text-xl p-1">🌗</button>
</header>

<div class="glass rounded-[28px] p-5 space-y-4">

    <input id="sw" placeholder="開始単語" class="w-full">

    <div class="grid grid-cols-3 gap-2">
        <input id="sc" placeholder="開始字">
        <input id="mc" placeholder="必須文字">
        <input id="ec" placeholder="終了字">
    </div>

    <details class="group border border-slate-200 dark:border-slate-700 rounded-2xl p-2">
        <summary class="py-3 text-center text-[11px] font-black text-blue-600 cursor-pointer">
            詳細設定
        </summary>

        <div class="space-y-5 pt-2 pb-4">

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="text-[10px] font-bold text-blue-500">全語開始字</label>
                    <input id="asc" placeholder="ア,カ">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-blue-500">全語終了字</label>
                    <input id="aec" placeholder="ン,イ">
                </div>
            </div>

            <div>
                <label class="text-[10px] font-bold text-emerald-500">使える文字</label>
                <input id="valid_chars" placeholder="アイウエオ (空欄で全許可)">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <label class="flex items-center gap-2"><input type="checkbox" id="allow_daku"> 濁点OK</label>
                <label class="flex items-center gap-2"><input type="checkbox" id="allow_handaku"> 半濁点OK</label>
                <label class="flex items-center gap-2 text-indigo-600"><input type="checkbox" id="auto_recovery"> 遡り接続</label>
                <label class="flex items-center gap-2 text-blue-600"><input type="checkbox" id="rt"> 牛耕</label>
                <label class="flex items-center gap-2 text-rose-500"><input type="checkbox" id="exclude_conjugate"> 共役排除</label>
                <label class="flex items-center gap-2 text-rose-600"><input type="checkbox" id="char_limit_mode"> 重複禁止</label>
            </div>

            <div class="bg-slate-100 dark:bg-slate-800 p-3 rounded-xl flex items-center gap-4">
                <label class="text-[10px] font-bold">50音ずらし</label>
                <label class="flex items-center gap-2"><input type="radio" name="shift_mode" value="abs" checked> ±</label>
                <label class="flex items-center gap-2"><input type="radio" name="shift_mode" value="normal"> 通常</label>
                <button onclick="adjustVal('ks_abs',-1)" class="step-btn">-</button>
                <input id="ks_abs" type="number" value="1" class="w-12 text-center bg-transparent border-none font-bold">
                <button onclick="adjustVal('ks_abs',1)" class="step-btn">+</button>
            </div>

        </div>
    </details>

    <div class="flex justify-end">
        <button onclick="run()" id="btn" class="bg-blue-600 text-white font-black px-8 py-3.5 rounded-2xl shadow-lg active:scale-95">
            Explore
        </button>
    </div>

    <div class="flex gap-3 text-[11px] font-bold">
        <label><input type="checkbox" name="cat" value="country" checked> 国</label>
        <label><input type="checkbox" name="cat" value="capital"> 首都</label>
    </div>

    <div id="stats" class="text-center text-[10px] font-bold text-blue-500 hidden"></div>

</div>

<div id="res" class="space-y-3 pb-20"></div>

</div>

<script>
let currentRoutes = [];
let wordStates = {};

function toggleDarkMode(){ document.documentElement.classList.toggle('dark'); }

function adjustVal(id,delta){
    const el=document.getElementById(id);
    el.value=Math.max(0,parseInt(el.value||0)+delta);
}

async function run(){
    const btn=document.getElementById('btn');
    btn.innerText="EXPLORING...";
    btn.disabled=true;

    const body={
        start_word:sw.value,
        start_char:sc.value,
        all_start_char:asc.value,
        must_char:mc.value,
        end_char:ec.value,
        all_end_char:aec.value,
        exclude_chars:exc.value,
        ban_start_chars:bsc.value,
        valid_chars:valid_chars.value,
        max_len:ml.value,
        use_shift:use_shift.checked,
        ks_abs:parseInt(ks_abs.value),
        shift_mode:document.querySelector('input[name="shift_mode"]:checked').value,
        allow_daku:allow_daku.checked,
        allow_handaku:allow_handaku.checked,
        auto_recovery:auto_recovery.checked,
        char_limit_mode:char_limit_mode.checked,
        round_trip:rt.checked,
        exclude_conjugate:exclude_conjugate.checked,
        categories:Array.from(document.querySelectorAll('input[name="cat"]:checked')).map(c=>c.value),
        red_words:Object.keys(wordStates).filter(k=>wordStates[k]==='red'),
        blue_words:Object.keys(wordStates).filter(k=>wordStates[k]==='blue')
    };

    const r=await fetch('/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const d=await r.json();
    currentRoutes=d.routes||[];
    btn.innerText="Explore";
    btn.disabled=false;
    display();
}

function display(){
    res.innerHTML=currentRoutes.map((rt,i)=>`
        <div class="glass p-4 rounded-[20px]">
            <div class="flex justify-between text-[10px] font-black text-slate-400">
                <span>#${i+1}</span>
                <button onclick="navigator.clipboard.writeText('${rt.join(" → ")}')" class="text-blue-600">Copy</button>
            </div>
            <div class="font-bold text-sm">${rt.join(' → ')}</div>
            <div class="text-[9px] font-black text-blue-500">${rt.join('').length} letters</div>
        </div>
    `).join('');
    stats.innerText=`${currentRoutes.length} ROUTES FOUND`;
    stats.classList.remove('hidden');
}
</script>

</body>
</html>
